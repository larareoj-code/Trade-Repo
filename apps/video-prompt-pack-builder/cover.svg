<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Video Prompt Pack Builder cover</title>
  <desc id="desc">Original abstract cover art showing a video planning board with prompt cards and timeline blocks.</desc>
