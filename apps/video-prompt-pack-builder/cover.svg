  <text x="190" y="549" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#075e67">Scene plan</text>
  <text x="190" y="644" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#7d2630">QA checklist</text>
